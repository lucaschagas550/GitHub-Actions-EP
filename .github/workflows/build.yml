name: Build Project

on: # Vai ser executado quando
  push: # Quando realizar o push para branch main
    branches: ["main"]
  pull_request: # Quando for criado um pull request para branch main
    branches: ["main"]
  workflow_dispatch: # Para Iniciar o workflow de forma manual

#Se existir um workflow sendo executado para mesma branch ele vai cancelar o mais antigo, porque ele ja nao tem mais valor e poupa recursos
concurrency: 
  group: ${{ github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  versionamento:
    runs-on: ubuntu-latest
    name: Versionamento

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: codacy/git-version@2.8.0
        id: version
        with:
          release-branch: main #branch principal
          prefix: v #prefixo da versao no casao v1.0.0 exemplo
        
      - name: Tag the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice:: ${{ steps.version.outputs.version }}"
          git config --global user.email "${{github.actor}}@users.noreply.github.com"
          git config --global user.name "${{github.actor}}"
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
          git push --tags
        if: github.ref == 'refs/heads/main' 
        #So vai ser criado a realese quando estiver sendo executado na branch principal, isto que o if faz

  backend-build-and-test:
    needs: versionamento #depende da conclusao do job de versionamento para ser executado
    runs-on: ubuntu-latest
    name: Backend Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Obtem sempre a ultima versao da tag 4
      
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: '8.x'
      
      - name: Restore
        run: |
          dotnet restore ./src/Todo.Api.sln
        
      - name: Build
        run: |
          dotnet build --no-restore --configuration Release ./src/Todo.Api.sln

      - name: Test
        run: |
            dotnet test --no-restore --no-build ./src/Todo.Api.sln --configuration Release --logger trx --results-directory "TestResults"          

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults #pasta onde se encontra os artefatos gerados

  frontend-build-and-test:
    needs: versionamento #depende da conclusao do job de versionamento para ser executado
    runs-on: ubuntu-latest
    name: Fronend Build and Test
    defaults:
      run:
        working-directory: ./src/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Obtem sempre a ultima versao da tag 4

      - name: Setup Node.Js
        uses: actions/setup-node@v4 # Obtem sempre a ultima versao da tag 4
        with:
          node-version: '20'
        
      - name: Install dependencies
        working-directory: ./src/web
        run: |
          npm ci

      - name: Test #Aqui seria os testes unitarios do frontend, como nao tem esta sendo executado o lint de exemplo
        working-directory: ./src/web
        run: |
          npm run lint
            
      - name: Build
        working-directory: ./src/web
        run: |
          npm run build

  backend-lint:
    needs: versionamento
    runs-on: ubuntu-latest
    name: Backend Lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Obtem sempre a ultima versao da tag 4
      with:
        fetch-depth: 0

    - uses: github/super-linter@v6
      env:
        DEFAULT_BRANCH: "main"
        VALIDATE_ALL_CODEBASE: "false"
        VALIDATE_YAML: "true"
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    needs: [ versionamento ] #para mais de uma dependencia passar os nomes em um array frontend-build-and-test
    runs-on: ubuntu-latest
    name: Frontend Lint
    defaults:
      run:
        working-directory: ./src/web

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Obtem sempre a ultima versao da tag 4

    - name: Setup Node.Js
      uses: actions/setup-node@v4 # Obtem sempre a ultima versao da tag 4
      with:
        node-version: '20'
      
    - name: Install dependencies
      working-directory: ./src/web
      run: |
        npm ci

    - name: Lint
      working-directory: ./src/web
      run: |
        npm run lint